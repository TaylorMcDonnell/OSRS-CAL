<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OSRS F2P Calculator</title>
<style>
  :root {
    --bg: #0f0f0f;
    --bg2: #1a1a1a;
    --bg3: #242424;
    --border: #2e2e2e;
    --border2: #3a3a3a;
    --text: #e8e8e8;
    --text2: #999;
    --text3: #666;
    --accent: #c89a3c;
    --accent2: #a07830;
    --green: #4caf7d;
    --red: #e05555;
    --blue: #4a9eff;
    --radius: 10px;
    --radius-sm: 6px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; min-height: 100vh; }
  
  /* Layout */
  .app { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
  .sidebar { background: var(--bg2); border-right: 1px solid var(--border); padding: 20px 16px; display: flex; flex-direction: column; gap: 6px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .main { padding: 24px; overflow-y: auto; }

  /* Sidebar */
  .logo { font-size: 16px; font-weight: 700; color: var(--accent); padding: 4px 8px 16px; letter-spacing: 0.5px; display: flex; align-items: center; gap: 8px; }
  .logo span { font-size: 11px; color: var(--text3); font-weight: 400; }
  .skill-btn { width: 100%; text-align: left; padding: 9px 12px; border-radius: var(--radius-sm); border: none; background: transparent; color: var(--text2); cursor: pointer; font-size: 13px; transition: all 0.15s; display: flex; align-items: center; gap: 8px; }
  .skill-btn:hover { background: var(--bg3); color: var(--text); }
  .skill-btn.active { background: var(--accent); color: #1a1000; font-weight: 600; }
  .skill-icon { font-size: 16px; width: 20px; text-align: center; }

  /* Main sections */
  .section { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
  .section-title { font-size: 12px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 14px; }
  
  /* User row */
  .user-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .user-row input { flex: 1; }
  
  /* Inputs */
  input[type=text], input[type=number], select {
    background: var(--bg3); border: 1px solid var(--border2); border-radius: var(--radius-sm);
    color: var(--text); padding: 8px 12px; font-size: 13px; width: 100%;
    outline: none; transition: border-color 0.15s;
  }
  input:focus, select:focus { border-color: var(--accent); }
  select option { background: var(--bg3); }
  
  button {
    background: var(--accent); color: #1a1000; border: none; border-radius: var(--radius-sm);
    padding: 8px 16px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s; white-space: nowrap;
  }
  button:hover { background: var(--accent2); }
  button.secondary { background: var(--bg3); color: var(--text2); border: 1px solid var(--border2); font-weight: 400; }
  button.secondary:hover { background: var(--border2); color: var(--text); }

  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  label { display: block; font-size: 11px; color: var(--text3); margin-bottom: 5px; }

  /* Stat chips */
  .stat-grid { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .stat-chip { background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 5px 10px; font-size: 12px; color: var(--text2); }
  .stat-chip strong { color: var(--text); }
  .stat-chip.highlight { border-color: var(--accent); color: var(--accent); }
  .stat-chip.highlight strong { color: var(--accent); }

  /* Gear grid */
  .gear-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .bonus-bar { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; padding: 10px 14px; background: var(--bg3); border-radius: var(--radius-sm); border: 1px solid var(--border); }
  .bonus-item { font-size: 12px; color: var(--text3); }
  .bonus-item b { color: var(--text); }

  /* Prayer */
  .prayer-grid { display: flex; flex-wrap: wrap; gap: 6px; }
  .prayer-btn { padding: 6px 12px; font-size: 12px; background: var(--bg3); border: 1px solid var(--border2); border-radius: var(--radius-sm); color: var(--text2); cursor: pointer; transition: all 0.15s; font-weight: 400; }
  .prayer-btn:hover { border-color: var(--accent); color: var(--text); background: var(--bg3); }
  .prayer-btn.active { background: var(--bg3); border-color: var(--accent); color: var(--accent); font-weight: 600; }

  /* Method list */
  .search-wrap { position: relative; margin-bottom: 12px; }
  .search-wrap input { padding-left: 34px; }
  .search-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--text3); font-size: 15px; }
  .method-list { display: flex; flex-direction: column; gap: 6px; max-height: 360px; overflow-y: auto; padding-right: 2px; }
  .method-list::-webkit-scrollbar { width: 4px; }
  .method-list::-webkit-scrollbar-track { background: transparent; }
  .method-list::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }
  .method-card { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 11px 14px; cursor: pointer; transition: all 0.15s; background: var(--bg3); }
  .method-card:hover { border-color: var(--border2); }
  .method-card.selected { border-color: var(--accent); background: #1e1800; }
  .method-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .method-name { font-size: 13px; font-weight: 500; color: var(--text); }
  .method-badges { display: flex; gap: 6px; flex-shrink: 0; }
  .badge { font-size: 11px; padding: 2px 7px; border-radius: 4px; font-weight: 600; }
  .badge-xp { background: #1e2e1a; color: var(--green); }
  .badge-gp { background: #2a2200; color: var(--accent); }
  .badge-loss { background: #2a1515; color: var(--red); }
  .method-sub { font-size: 11px; color: var(--text3); margin-top: 4px; }

  /* Results */
  .results-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .result-card { background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px; }
  .result-label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
  .result-val { font-size: 22px; font-weight: 700; color: var(--text); }
  .result-val.green { color: var(--green); }
  .result-val.red { color: var(--red); }
  .result-val.gold { color: var(--accent); }

  /* XP bar */
  .xp-bar-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--text3); margin-bottom: 6px; }
  .xp-bar-track { height: 6px; background: var(--bg3); border-radius: 999px; overflow: hidden; border: 1px solid var(--border); }
  .xp-bar-fill { height: 100%; background: var(--accent); border-radius: 999px; transition: width 0.4s ease; }

  /* Drop table */
  .drops-grid { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .drop-chip { background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 5px 10px; font-size: 12px; display: flex; align-items: center; gap: 6px; }
  .drop-chip .drop-name { color: var(--text2); }
  .drop-chip .drop-qty { color: var(--text3); font-size: 11px; }
  .drop-chip .drop-price { color: var(--accent); font-size: 11px; font-weight: 600; }
  .drop-chip.rare { border-color: #5a3a00; }
  .drop-chip.rare .drop-name { color: #e8a030; }

  /* Status */
  .status { font-size: 12px; color: var(--text3); margin-top: 6px; min-height: 18px; }
  .status.ok { color: var(--green); }
  .status.err { color: var(--red); }
  .status.loading { color: var(--accent); }
  .warn { font-size: 12px; color: #e8a030; margin-top: 8px; }
  .empty { color: var(--text3); font-size: 13px; text-align: center; padding: 20px 0; }

  /* Divider */
  hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg2); }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }
</style>
</head>

      <hr />

    <!-- Methods -->

      <div class="search-wrap">

      <div class="xp-bar-labels"><span id="xpBarLeft"></span><span id="xpBarRight"></span></div>

      <div class="status" id="dropsStatus"></div>
      <div class="drops-grid" id="dropsGrid"></div>
    </div>

  </main>
</div>

// ─── INIT ────────────────────────────────────────────────────
function init() {
  // Load saved username
  const saved = localStorage.getItem('osrs_username');
  if (saved) {
    document.getElementById('username').value = saved;
    fetchHiscores(true);
  }
  renderNav();
  renderGear();
  renderMethods();

// ─── GE PRICES ───────────────────────────────────────────────
async function fetchGEPrices() {
  try {
    const r = await fetch('https://prices.runescape.wiki/api/v1/osrs/latest', {headers:{'User-Agent':'OSRS-F2P-Calc'}});
    const d = await r.json();
    geprices = d.data || {};
  } catch(e) { /* silent fail, use static gp */ }
}

// ─── HISCORES ────────────────────────────────────────────────
async function fetchHiscores(silent=false) {
  const username = document.getElementById('username').value.trim();
  if (!username) return;
  const msg = document.getElementById('statusMsg');
  if (!silent) msg.className='status loading', msg.textContent='Fetching stats…';

  const hiScoresUrl = 'https://secure.runescape.com/m=hiscore_oldschool/index_lite.ws?player='+encodeURIComponent(username);
  const proxies = [
    u => 'https://api.allorigins.win/raw?url='+encodeURIComponent(u),
    u => 'https://corsproxy.io/?'+encodeURIComponent(u),
    u => 'https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(u),
  ];

  let text = null;
  for (const proxy of proxies) {
    try {
      const r = await fetch(proxy(hiScoresUrl));
      if (!r.ok) continue;
      const t = await r.text();
      if (t && t.includes(',')) { text = t; break; }
    } catch(e) { continue; }
  }

  if (!text) {
    msg.className='status err';
    msg.textContent='✗ Could not reach hiscores — try again in a moment';
    document.getElementById('statGrid').innerHTML='';
    return;
  }

  try {
    const lines = text.trim().split('\n');
    playerStats = {};
    for (const [skill, idx] of Object.entries(SKILL_IDX)) {
      const parts = lines[idx]?.split(',');
      if (parts) playerStats[skill] = {level:parseInt(parts[1]),xp:parseInt(parts[2])};
    }
    localStorage.setItem('osrs_username', username);
    msg.className='status ok';
    msg.textContent='✓ Loaded stats for '+username;
    renderStatGrid();
    autoFillLevel();
  } catch(e) {
    msg.className='status err';
    msg.textContent='✗ Could not parse stats — try again';
    document.getElementById('statGrid').innerHTML='';
  }
}

function clearUser() {
  localStorage.removeItem('osrs_username');
  document.getElementById('username').value='';
  document.getElementById('statusMsg').textContent='';
  document.getElementById('statGrid').innerHTML='';
  playerStats={};
}

function renderStatGrid() {
  const order=['attack','strength','defence','ranged','magic','prayer','hitpoints','woodcutting','fishing','firemaking','mining','smithing','cooking','crafting','runecraft'];
  document.getElementById('statGrid').innerHTML = order.map(s => {
    const d = playerStats[s];
    if (!d) return '';
    const hl = s===currentSkill ? ' highlight':'';
    return `<div class="stat-chip${hl}">${SKILL_ICONS[s]||''} ${s.charAt(0).toUpperCase()+s.slice(1,3)} <strong>${d.level}</strong></div>`;
  }).join('');
}

function autoFillLevel() {
  // just fills value, never locks the field
  const d = playerStats[currentSkill];
  if (d) document.getElementById('currentLvl').value = d.level;
  calculate();
}

// ─── COMBAT XP/HR ESTIMATOR ──────────────────────────────────
function getPrayerMult() {
  const skill = currentSkill;
  let list = skill==='ranged'?PRAYERS.ranged:skill==='magic'?PRAYERS.magic:PRAYERS.melee;
  const p = list[selectedPrayer]||list[0];
  return p.mult||1;
}

function estimateXphr(m) {
  if (!m.combat) return m.base;
  const w = GEAR.weapon[selectedGear.weapon];
  const ammo = GEAR.ammo[selectedGear.ammo];
  const pMult = getPrayerMult();
  const atkLvl = parseInt(document.getElementById('currentLvl').value)||1;

  if (currentSkill==='magic') return m.base;

  if (currentSkill==='ranged' || w.isRange) {
    const rangeLvl = playerStats.ranged?.level || atkLvl;
    const rangeBonus = (w.range||0)+(ammo?.range||0);
    const effLvl = Math.floor(rangeLvl * pMult);
    const maxHit = Math.floor(0.5 + effLvl*(rangeBonus+64)/640);
    const acc = Math.min(0.97, (effLvl*2+rangeBonus)/((m.eDef||0)*2+100));
    const avgHit = maxHit*acc*0.5;
    const ticksPerKill = ((m.eHp||20)/Math.max(avgHit,0.3))*(w.speed||5);
    const kph = Math.floor(3600/(ticksPerKill*0.6));
    return Math.max(m.base*0.4, Math.min(m.base*2.8, kph*m.xpEach));
  }

  // melee
  const strLvl = playerStats.strength?.level || atkLvl;
  const effStr = Math.floor(strLvl * pMult);
  const effAtk = Math.floor(atkLvl * (getPrayerMult()));
  const maxHit = Math.floor(0.5 + effStr*(w.str+64)/640);
  const acc = Math.min(0.97, (effAtk*2+w.atk)/((m.eDef||0)*2+100));
  const avgHit = maxHit*acc*0.5;
  const ticksPerKill = ((m.eHp||20)/Math.max(avgHit,0.3))*(w.speed||4);
  const kph = Math.floor(3600/(ticksPerKill*0.6));
  return Math.max(m.base*0.4, Math.min(m.base*2.8, kph*m.xpEach));
}

// ─── GP/HR ───────────────────────────────────────────────────
function getGphr(m, xphr) {
  if (m.gpPerAction != null) {
    const actionsPerHr = xphr / m.xpEach;
    return Math.round(actionsPerHr * m.gpPerAction);
  }
  return null;
}

// ─── METHODS ─────────────────────────────────────────────────
function renderMethods(filter='') {
  const methods = METHODS[currentSkill].methods.filter(m =>
    m.name.toLowerCase().includes(filter.toLowerCase())
  );
  const el = document.getElementById('methodList');
  if (!methods.length) { el.innerHTML='<div class="empty">No methods found</div>'; return; }
  el.innerHTML = methods.map(m => {
    const xphr = estimateXphr(m);
    const gphr = getGphr(m, xphr);
    let gpBadge = '';
    if (gphr != null) {
      const cls = gphr >= 0 ? 'badge-gp' : 'badge-loss';
      const sign = gphr >= 0 ? '+' : '';
      gpBadge = `<span class="badge ${cls}">${sign}${fmtNum(gphr)} gp/hr</span>`;
    }
    return `<div class="method-card${selectedMethod&&selectedMethod.name===m.name?' selected':''}"
      onclick="selectMethod('${m.name.replace(/'/g,"\\'")}')">
      <div class="method-top">
        <span class="method-name">${m.name}</span>
        <span class="method-badges">
          <span class="badge badge-xp">${fmtNum(xphr)} xp/hr</span>
          ${gpBadge}
        </span>
      </div>
      <div class="method-sub">${fmtNum(m.xpEach)} xp each · Req lv ${m.lvl}${m.note?' · '+m.note:''}</div>
    </div>`;
  }).join('');
}

function selectMethod(name) {
  selectedMethod = METHODS[currentSkill].methods.find(m=>m.name===name);
  renderMethods(document.getElementById('methodSearch').value);
  calculate();
  if (selectedMethod?.drops) loadDrops(selectedMethod.drops, selectedMethod.name);
  else document.getElementById('dropsSection').style.display='none';
}

// ─── DROPS ───────────────────────────────────────────────────
async function loadDrops(key, label) {
  const sec = document.getElementById('dropsSection');
  const grid = document.getElementById('dropsGrid');
  const status = document.getElementById('dropsStatus');
  document.getElementById('dropsEnemy').textContent = label;
  sec.style.display='block';
  grid.innerHTML='';
  status.textContent='Loading drop table…';
  status.className='status loading';

  // Try OSRS Wiki API
  try {
    const wikiName = key.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
    const r = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent('https://oldschool.runescape.wiki/api.php?action=parse&page='+encodeURIComponent(wikiName)+'&prop=wikitext&format=json')}`);
    const d = await r.json();
    if (d?.parse?.wikitext?.['*']) {
      const drops = parseWikiDrops(d.parse.wikitext['*']);
      if (drops.length > 0) {
        status.textContent='';
        renderDrops(drops);
        return;
      }
    }
  } catch(e) {}

  // Fallback to static
  const staticDrops = STATIC_DROPS[key];
  if (staticDrops) {
    status.textContent='';
    renderDrops(staticDrops);
  } else {
    status.className='status';
    status.textContent='Drop data unavailable for this enemy.';
  }
}

function parseWikiDrops(wikitext) {
  const drops = [];
  const regex = /\|\s*([^\|]+?)\s*\|\|\s*([\d,\-]+(?:\s*[\-–]\s*[\d,]+)?)\s*\|\|\s*([\d.,]+)/g;
  let m;
  const seen = new Set();
  while ((m=regex.exec(wikitext))!==null && drops.length<12) {
    const name = m[1].replace(/\[\[|\]\]/g,'').split('|')[0].trim();
    const qty = m[2].trim();
    if (name && !seen.has(name) && name.length>1 && name.length<40) {
      seen.add(name);
      drops.push({name, qty, rare: parseFloat(m[3])<1});
    }
  }
  return drops;
}

function renderDrops(drops) {
  document.getElementById('dropsGrid').innerHTML = drops.map(d =>
    `<div class="drop-chip${d.rare?' rare':''}">
      <span class="drop-name">${d.name}</span>
      <span class="drop-qty">×${d.qty}</span>
    </div>`
  ).join('');
}

// ─── CALCULATE ───────────────────────────────────────────────
function calculate() {
  const sec = document.getElementById('resultsSection');
  if (!selectedMethod) { sec.style.display='none'; return; }
  const curLvl = parseInt(document.getElementById('currentLvl').value)||1;
  const tgtLvl = parseInt(document.getElementById('targetLvl').value)||99;
  const curXP = XP_TABLE[Math.min(curLvl,99)];
  const tgtXP = XP_TABLE[Math.min(tgtLvl,99)];
  const xpNeeded = Math.max(0, tgtXP-curXP);
  const xphr = estimateXphr(selectedMethod);
  const hours = xpNeeded/xphr;
  const actions = Math.ceil(xpNeeded/selectedMethod.xpEach);
  const gphr = getGphr(selectedMethod, xphr);
  const progress = Math.min(100,(curXP/XP_TABLE[99])*100);

  sec.style.display='block';
  let gpCard = '';
  if (gphr != null) {
    const cls = gphr>=0?'green':'red';
    const sign = gphr>=0?'+':'';
    gpCard = `<div class="result-card"><div class="result-label">GP / hr</div><div class="result-val ${cls}">${sign}${fmtNum(gphr)}</div></div>`;
  }
  document.getElementById('resultsGrid').innerHTML =
    `<div class="result-card"><div class="result-label">XP needed</div><div class="result-val">${fmtNum(xpNeeded)}</div></div>
     <div class="result-card"><div class="result-label">Time</div><div class="result-val gold">${fmtTime(hours)}</div></div>
     <div class="result-card"><div class="result-label">${selectedMethod.unit}</div><div class="result-val">${fmtNum(actions)}</div></div>
     ${gpCard}
     <div class="result-card"><div class="result-label">Levels</div><div class="result-val" style="font-size:16px">${curLvl} → ${tgtLvl}</div></div>`;

  document.getElementById('lvlWarn').innerHTML = curLvl<selectedMethod.lvl
    ? `<div class="warn">⚠ This method requires level ${selectedMethod.lvl}</div>` : '';
  document.getElementById('xpBarFill').style.width = progress+'%';
  document.getElementById('xpBarLeft').textContent = fmtNum(curXP)+' XP';
  document.getElementById('xpBarRight').textContent = fmtNum(xpNeeded)+' XP to go';
}

// ─── UTILS ───────────────────────────────────────────────────
function fmtNum(n) {
  if (Math.abs(n)>=1e6) return (n/1e6).toFixed(2)+'M';
  if (Math.abs(n)>=1e3) return (n/1e3).toFixed(1)+'K';
  return Math.round(n).toLocaleString();
}
function fmtTime(h) {
  if (h<1/60) return Math.round(h*3600)+' sec';
  if (h<1) return Math.round(h*60)+' min';
  const hh=Math.floor(h), mm=Math.round((h-hh)*60);
  return mm===0?hh+'h':hh+'h '+mm+'m';
}

// ─── EVENTS ──────────────────────────────────────────────────
document.getElementById('username').addEventListener('keydown', e=>{ if(e.key==='Enter') fetchHiscores(); });
document.getElementById('methodSearch').addEventListener('input', e=>renderMethods(e.target.value));
['currentLvl','targetLvl'].forEach(id=>document.getElementById(id).addEventListener('input', calculate));

init();
</script>
