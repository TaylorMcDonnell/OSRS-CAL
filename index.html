<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OSRS F2P Calculator v4</title>
<style>
  :root {
    --bg: #0f0f0f;
    --bg2: #1a1a1a;
    --bg3: #242424;
    --border: #2e2e2e;
    --border2: #3a3a3a;
    --text: #e8e8e8;
    --text2: #999;
    --text3: #666;
    --accent: #c89a3c;
    --accent2: #a07830;
    --green: #4caf7d;
    --red: #e05555;
    --blue: #4a9eff;
    --radius: 10px;
    --radius-sm: 6px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; min-height: 100vh; }
  
  /* Layout */
  .app { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
  .sidebar { background: var(--bg2); border-right: 1px solid var(--border); padding: 20px 16px; display: flex; flex-direction: column; gap: 6px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  .main { padding: 24px; overflow-y: auto; }

  /* Sidebar */
  .logo { font-size: 16px; font-weight: 700; color: var(--accent); padding: 4px 8px 16px; letter-spacing: 0.5px; display: flex; align-items: center; gap: 8px; }
  .logo span { font-size: 11px; color: var(--text3); font-weight: 400; }
  .skill-btn { width: 100%; text-align: left; padding: 9px 12px; border-radius: var(--radius-sm); border: none; background: transparent; color: var(--text2); cursor: pointer; font-size: 13px; transition: all 0.15s; display: flex; align-items: center; gap: 8px; }
  .skill-btn:hover { background: var(--bg3); color: var(--text); }
  .skill-btn.active { background: var(--accent); color: #1a1000; font-weight: 600; }
  .skill-icon { font-size: 16px; width: 20px; text-align: center; }

  /* Main sections */
  .section { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
  .section-title { font-size: 12px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 14px; }
  
  /* User row */
  .user-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .user-row input { flex: 1; }
  
  /* Inputs */
  input[type=text], input[type=number], select {
    background: var(--bg3); border: 1px solid var(--border2); border-radius: var(--radius-sm);
    color: var(--text); padding: 8px 12px; font-size: 13px; width: 100%;
    outline: none; transition: border-color 0.15s;
  }
  input:focus, select:focus { border-color: var(--accent); }
  select option { background: var(--bg3); }
  
  button {
    background: var(--accent); color: #1a1000; border: none; border-radius: var(--radius-sm);
    padding: 8px 16px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s; white-space: nowrap;
  }
  button:hover { background: var(--accent2); }
  button.secondary { background: var(--bg3); color: var(--text2); border: 1px solid var(--border2); font-weight: 400; }
  button.secondary:hover { background: var(--border2); color: var(--text); }

  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  label { display: block; font-size: 11px; color: var(--text3); margin-bottom: 5px; }

  /* Stat chips */
  .stat-grid { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .stat-chip { background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 5px 10px; font-size: 12px; color: var(--text2); }
  .stat-chip strong { color: var(--text); }
  .stat-chip.highlight { border-color: var(--accent); color: var(--accent); }
  .stat-chip.highlight strong { color: var(--accent); }

  /* Gear grid */
  .gear-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .bonus-bar { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; padding: 10px 14px; background: var(--bg3); border-radius: var(--radius-sm); border: 1px solid var(--border); }
  .bonus-item { font-size: 12px; color: var(--text3); }
  .bonus-item b { color: var(--text); }

  /* Prayer */
  .prayer-grid { display: flex; flex-wrap: wrap; gap: 6px; }
  .prayer-btn { padding: 6px 12px; font-size: 12px; background: var(--bg3); border: 1px solid var(--border2); border-radius: var(--radius-sm); color: var(--text2); cursor: pointer; transition: all 0.15s; font-weight: 400; }
  .prayer-btn:hover { border-color: var(--accent); color: var(--text); background: var(--bg3); }
  .prayer-btn.active { background: var(--bg3); border-color: var(--accent); color: var(--accent); font-weight: 600; }

  /* Method list */
  .search-wrap { position: relative; margin-bottom: 12px; }
  .search-wrap input { padding-left: 34px; }
  .search-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--text3); font-size: 15px; }
  .method-list { display: flex; flex-direction: column; gap: 6px; max-height: 360px; overflow-y: auto; padding-right: 2px; }
  .method-list::-webkit-scrollbar { width: 4px; }
  .method-list::-webkit-scrollbar-track { background: transparent; }
  .method-list::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }
  .method-card { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 11px 14px; cursor: pointer; transition: all 0.15s; background: var(--bg3); }
  .method-card:hover { border-color: var(--border2); }
  .method-card.selected { border-color: var(--accent); background: #1e1800; }
  .method-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .method-name { font-size: 13px; font-weight: 500; color: var(--text); }
  .method-badges { display: flex; gap: 6px; flex-shrink: 0; }
  .badge { font-size: 11px; padding: 2px 7px; border-radius: 4px; font-weight: 600; }
  .badge-xp { background: #1e2e1a; color: var(--green); }
  .badge-gp { background: #2a2200; color: var(--accent); }
  .badge-loss { background: #2a1515; color: var(--red); }
  .method-sub { font-size: 11px; color: var(--text3); margin-top: 4px; }

  /* Results */
  .results-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .result-card { background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px; }
  .result-label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
  .result-val { font-size: 22px; font-weight: 700; color: var(--text); }
  .result-val.green { color: var(--green); }
  .result-val.red { color: var(--red); }
  .result-val.gold { color: var(--accent); }

  /* XP bar */
  .xp-bar-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--text3); margin-bottom: 6px; }
  .xp-bar-track { height: 6px; background: var(--bg3); border-radius: 999px; overflow: hidden; border: 1px solid var(--border); }
  .xp-bar-fill { height: 100%; background: var(--accent); border-radius: 999px; transition: width 0.4s ease; }

  /* Drop table */
  .drops-grid { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .drop-chip { background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 5px 10px; font-size: 12px; display: flex; align-items: center; gap: 6px; }
  .drop-chip .drop-name { color: var(--text2); }
  .drop-chip .drop-qty { color: var(--text3); font-size: 11px; }
  .drop-chip .drop-price { color: var(--accent); font-size: 11px; font-weight: 600; }
  .drop-chip.rare { border-color: #5a3a00; }
  .drop-chip.rare .drop-name { color: #e8a030; }

  /* Status */
  .status { font-size: 12px; color: var(--text3); margin-top: 6px; min-height: 18px; }
  .status.ok { color: var(--green); }
  .status.err { color: var(--red); }
  .status.loading { color: var(--accent); }
  .warn { font-size: 12px; color: #e8a030; margin-top: 8px; }
  .empty { color: var(--text3); font-size: 13px; text-align: center; padding: 20px 0; }

  /* Divider */
  hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg2); }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }
</style>
</head>

<div class="app">

      <div class="status" id="statusMsg"></div>
      <div class="stat-grid" id="statGrid"></div>
    </div>

    <!-- Skill + target -->
    <div class="section">
      <div class="section-title" id="skillSectionTitle">Skill &amp; target</div>
      <div class="row2" style="margin-bottom:10px">
        <div><label>Current level <span style="color:var(--text3);font-weight:400;font-size:10px">(editable)</span></label><input type="number" id="currentLvl" min="1" max="99" value="1" style="background:var(--bg3);border-color:var(--accent)" /></div>
        <div><label>Target level</label><input type="number" id="targetLvl" min="1" max="99" value="99" /></div>
      </div>
    </div>

    <!-- Gear (combat only) -->
    <div class="section" id="gearSection" style="display:none">
      <div class="section-title">Gear <span style="color:var(--text3);font-weight:400;text-transform:none;letter-spacing:0">(F2P only)</span></div>
      <div class="gear-grid" id="gearSlots"></div>
      <div class="bonus-bar" id="bonusBar"></div>

      <hr />
      <div class="section-title" style="margin-bottom:10px">Prayer bonus</div>
      <div class="prayer-grid" id="prayerGrid"></div>
    </div>

    <!-- Methods -->
    <div class="section">
      <div class="section-title">Training method</div>
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="methodSearch" placeholder="Search methods…" />
      </div>
      <div class="method-list" id="methodList"></div>
    </div>

    <!-- Results -->
    <div class="section" id="resultsSection" style="display:none">
      <div class="section-title">Results</div>
      <div class="results-grid" id="resultsGrid"></div>
      <div class="xp-bar-labels"><span id="xpBarLeft"></span><span id="xpBarRight"></span></div>
      <div class="xp-bar-track"><div class="xp-bar-fill" id="xpBarFill" style="width:0%"></div></div>
      <div id="lvlWarn"></div>
    </div>

    <!-- Cost breakdown -->
    <div class="section" id="costSection" style="display:none">
      <div class="section-title">💰 Material cost — <span id="costMethodName" style="color:var(--accent);font-weight:400;text-transform:none;letter-spacing:0"></span></div>
      <div class="results-grid" id="costGrid"></div>
      <div style="font-size:11px;color:var(--text3);margin-top:8px">Prices from OSRS Wiki GE API · Updates every ~5 min</div>
    </div>

    <!-- Roadmap -->
    <div class="section" id="roadmapSection" style="display:none">
      <div class="section-title" id="roadmapTitle">Route to 99</div>
      <div id="roadmapSummary"></div>
      <div id="roadmapSteps"></div>
    </div>

    <!-- Drop table -->
    <div class="section" id="dropsSection" style="display:none">
      <div class="section-title">Notable drops — <span id="dropsEnemy" style="color:var(--accent);font-weight:400;text-transform:none;letter-spacing:0"></span></div>
      <div class="status" id="dropsStatus"></div>
      <div class="drops-grid" id="dropsGrid"></div>
    </div>

  </main>
</div>

const ROADMAP_SKILLS = ['cooking','prayer','firemaking','crafting'];

function renderRoadmap() {
  const skill = currentSkill;
  const sec = document.getElementById('roadmapSection');
  if (!ROADMAP_SKILLS.includes(skill)) { sec.style.display='none'; return; }

  const roadmap = ROADMAPS[skill];
  const curLvl = Math.min(99, Math.max(1, parseInt(document.getElementById('currentLvl').value) || 1));
  sec.style.display = 'block';

  // Calculate totals
  let totalGP = 0, totalHours = 0, totalItems = 0;
  const rows = roadmap.map(step => {
    const from = Math.max(step.fromLvl, curLvl);
    const to = step.toLvl;
    if (from >= to) return null; // already past this bracket

    const xpNeeded = XP_TABLE[to] - XP_TABLE[from];
    const baseItems = Math.ceil(xpNeeded / step.xpEach);
    const totalWithBurns = Math.ceil(baseItems * (1 + step.burnRate));
    const livePrice = getLivePrice(step.itemId);
    const priceEach = livePrice || Math.abs(step.gpEach);
    const cost = totalWithBurns * priceEach * (step.gpEach < 0 ? -1 : 1);
    const hours = xpNeeded / step.xphr;

    totalGP += step.gpEach < 0 ? -Math.abs(cost) : 0;
    totalHours += hours;
    totalItems += totalWithBurns;

    const past = from <= curLvl && to <= curLvl;
    const current = from <= curLvl && to > curLvl;
    const future = from >= curLvl;

    return { step, from, to, xpNeeded, baseItems, totalWithBurns, priceEach, cost, hours, livePrice, past, current, future };
  }).filter(Boolean);

  const totalCostStr = totalGP < 0 ? `-${fmtNum(Math.abs(totalGP))} gp` : `+${fmtNum(totalGP)} gp`;
  const totalCostColor = totalGP < 0 ? 'var(--red)' : 'var(--green)';

  document.getElementById('roadmapTitle').textContent = skill.charAt(0).toUpperCase()+skill.slice(1)+' — Route to 99';
  document.getElementById('roadmapSummary').innerHTML = `
    <div style="display:flex;gap:20px;flex-wrap:wrap;padding:12px 14px;background:var(--bg3);border-radius:var(--radius-sm);border:1px solid var(--border);margin-bottom:14px">
      <div><div style="font-size:11px;color:var(--text3);margin-bottom:3px">TOTAL TIME</div><div style="font-size:18px;font-weight:600;color:var(--accent)">${fmtTime(totalHours)}</div></div>
      <div><div style="font-size:11px;color:var(--text3);margin-bottom:3px">TOTAL COST</div><div style="font-size:18px;font-weight:600;color:${totalCostColor}">${totalCostStr}</div></div>
      <div><div style="font-size:11px;color:var(--text3);margin-bottom:3px">ITEMS TO BUY</div><div style="font-size:18px;font-weight:600;color:var(--text)">${fmtNum(totalItems)}</div></div>
      <div style="font-size:11px;color:var(--text3);margin-top:auto">${rows.some(r=>r.livePrice)?'🟢 Using live GE prices':'⚪ Using estimated prices'}</div>
    </div>
  `;

  document.getElementById('roadmapSteps').innerHTML = rows.map((r,i) => {
    const isCurrent = r.current;
    const burnNote = r.step.burnRate > 0 ? `<span style="color:#e8a030;font-size:11px"> · ~${Math.round(r.step.burnRate*100)}% burn rate, buy ${r.totalWithBurns} (${r.baseItems} base + ${r.totalWithBurns-r.baseItems} extra)</span>` : '';
    const costColor = r.step.gpEach < 0 ? 'var(--red)' : 'var(--green)';
    const costSign = r.step.gpEach < 0 ? '-' : '+';
    return `
      <div style="border:1px solid ${isCurrent?'var(--accent)':'var(--border)'};border-radius:var(--radius-sm);padding:12px 14px;background:${isCurrent?'#1e1800':'var(--bg3)'};margin-bottom:8px">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
          <div>
            <span style="font-size:13px;font-weight:600;color:${isCurrent?'var(--accent)':'var(--text)'}">
              ${isCurrent?'▶ ':''}Lv ${r.from} → ${r.to}
            </span>
            <span style="font-size:13px;color:var(--text2);margin-left:8px">${r.step.method}</span>
            ${isCurrent?'<span style="font-size:11px;background:var(--accent);color:#1a1000;padding:2px 7px;border-radius:4px;margin-left:8px;font-weight:600">CURRENT</span>':''}
          </div>
          <div style="display:flex;gap:12px;flex-shrink:0">
            <span style="font-size:12px;color:var(--text3)">${fmtTime(r.hours)}</span>
            <span style="font-size:12px;font-weight:600;color:${costColor}">${costSign}${fmtNum(Math.abs(r.cost))} gp</span>
            <span style="font-size:12px;color:var(--text3)">${fmtNum(r.totalWithBurns)} ${r.step.itemId===532?'bones':r.step.itemId===526?'bones':'items'}</span>
          </div>
        </div>
        <div style="font-size:11px;color:var(--text3);margin-top:5px">${r.step.note}${burnNote}</div>
        <div style="font-size:11px;color:var(--text3);margin-top:2px">${r.priceEach} gp each ${r.livePrice?'🟢':'⚪'} · ${fmtNum(r.xpNeeded)} XP needed</div>
      </div>
    `;
  }).join('');
}

function applyPreset(presetName) {
  const skillType = currentSkill === 'ranged' ? 'ranged' : currentSkill === 'magic' ? 'magic' : 'melee';

  renderMethods();
  calculate();

  const saved = localStorage.getItem('osrs_gear');
  if (saved) {
    try { selectedGear = JSON.parse(saved); } catch(e) {}
  }
}

function getItemPrice(id) {
  const d = geprices[id];
  if (!d) return null;
  return Math.round((d.high + d.low) / 2);
}

function getTotalCost(method, actionsNeeded) {
  const item = BUYABLE_ITEMS[method.name];
  if (!item) return null;

  const price1 = getItemPrice(item.id);
  if (price1 === null) return null;

  let costPerAction = price1 * item.qty;
  let breakdown = `${item.qty}x ${item.name} @ ${fmtNum(price1)} gp`;

  // Second ingredient (e.g. coal for steel bars)
  if (item.id2) {
    const price2 = getItemPrice(item.id2);
    if (price2 !== null) {
      costPerAction += price2 * item.qty2;
      breakdown += ` + ${item.qty2}x ${item.name2} @ ${fmtNum(price2)} gp`;
    }
  }

  const totalCost = Math.round(costPerAction * actionsNeeded);
  const totalItems = actionsNeeded * item.qty;
  return { totalCost, costPerAction, totalItems, breakdown, itemName: item.name };
}

// ─── HISCORES ────────────────────────────────────────────────
async function fetchHiscores(silent=false) {
  const username = document.getElementById('username').value.trim();
  if (!username) return;
  const msg = document.getElementById('statusMsg');
  if (!silent) msg.className='status loading', msg.textContent='Fetching stats…';

  const hiScoresUrl = 'https://secure.runescape.com/m=hiscore_oldschool/index_lite.ws?player='+encodeURIComponent(username);
  const proxies = [
    u => 'https://api.allorigins.win/raw?url='+encodeURIComponent(u),
    u => 'https://corsproxy.io/?'+encodeURIComponent(u),
    u => 'https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(u),
  ];

  let text = null;
  for (const proxy of proxies) {
    try {
      const r = await fetch(proxy(hiScoresUrl));
      if (!r.ok) continue;
      const t = await r.text();
      if (t && t.includes(',')) { text = t; break; }
    } catch(e) { continue; }
  }

  if (!text) {
    msg.className='status err';
    msg.textContent='✗ Could not reach hiscores — try again in a moment';
    document.getElementById('statGrid').innerHTML='';
    return;
  }

  try {
    const lines = text.trim().split('\n');
    playerStats = {};
    for (const [skill, idx] of Object.entries(SKILL_IDX)) {
      const parts = lines[idx]?.split(',');
      if (parts) playerStats[skill] = {level:parseInt(parts[1]),xp:parseInt(parts[2])};
    }
    localStorage.setItem('osrs_username', username);
    msg.className='status ok';
    msg.textContent='✓ Loaded stats for '+username;
    renderStatGrid();
    autoFillLevel();
  } catch(e) {
    msg.className='status err';
    msg.textContent='✗ Could not parse stats — try again';
    document.getElementById('statGrid').innerHTML='';
  }
}

// ─── COMBAT XP/HR ESTIMATOR ──────────────────────────────────
function getPrayerMult() {
  const skill = currentSkill;
  let list = skill==='ranged'?PRAYERS.ranged:skill==='magic'?PRAYERS.magic:PRAYERS.melee;
  const p = list[selectedPrayer]||list[0];
  return p.mult||1;
}

function estimateXphr(m) {
  if (!m.combat) return m.base;
  const w = GEAR.weapon[selectedGear.weapon];
  const ammo = GEAR.ammo[selectedGear.ammo];
  const pMult = getPrayerMult();
  const atkLvl = Math.max(1, parseInt(document.getElementById('currentLvl').value)||1);

  if (currentSkill==='magic') return m.base;

  if (currentSkill==='ranged' || w.isRange) {
    const rangeLvl = playerStats.ranged?.level || atkLvl;
    const rangeBonus = (w.range||0)+(ammo?.range||0);
    const effLvl = Math.floor(rangeLvl * pMult);
    const maxHit = Math.floor(0.5 + effLvl*(rangeBonus+64)/640);
    const acc = Math.min(0.97, (effLvl*2+rangeBonus)/((m.eDef||0)*2+100));
    const avgHit = maxHit*acc*0.5;
    const ticksPerKill = ((m.eHp||20)/Math.max(avgHit,0.3))*(w.speed||5);
    const kph = Math.floor(3600/(ticksPerKill*0.6));
    return Math.max(m.base*0.4, Math.min(m.base*2.8, kph*m.xpEach));
  }

  // melee
  const strLvl = playerStats.strength?.level || atkLvl;
  const effStr = Math.floor(strLvl * pMult);
  const effAtk = Math.floor(atkLvl * (getPrayerMult()));
  const maxHit = Math.floor(0.5 + effStr*(w.str+64)/640);
  const acc = Math.min(0.97, (effAtk*2+w.atk)/((m.eDef||0)*2+100));
  const avgHit = maxHit*acc*0.5;
  const ticksPerKill = ((m.eHp||20)/Math.max(avgHit,0.3))*(w.speed||4);
  const kph = Math.floor(3600/(ticksPerKill*0.6));
  return Math.max(m.base*0.4, Math.min(m.base*2.8, kph*m.xpEach));
}

// ─── GP/HR ───────────────────────────────────────────────────
function getGphr(m, xphr) {
  if (m.gpPerAction != null) {
    const actionsPerHr = xphr / m.xpEach;
    return Math.round(actionsPerHr * m.gpPerAction);
  }
  return null;
}

// ─── DROPS ───────────────────────────────────────────────────
async function loadDrops(key, label) {
  const sec = document.getElementById('dropsSection');
  const grid = document.getElementById('dropsGrid');
  const status = document.getElementById('dropsStatus');
  document.getElementById('dropsEnemy').textContent = label;
  sec.style.display='block';
  grid.innerHTML='';
  status.textContent='Loading drop table…';
  status.className='status loading';

  // Try OSRS Wiki API
  try {
    const wikiName = key.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
    const r = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent('https://oldschool.runescape.wiki/api.php?action=parse&page='+encodeURIComponent(wikiName)+'&prop=wikitext&format=json')}`);
    const d = await r.json();
    if (d?.parse?.wikitext?.['*']) {
      const drops = parseWikiDrops(d.parse.wikitext['*']);
      if (drops.length > 0) {
        status.textContent='';
        renderDrops(drops);
        return;
      }
    }
  } catch(e) {}

  // Fallback to static
  const staticDrops = STATIC_DROPS[key];
  if (staticDrops) {
    status.textContent='';
    renderDrops(staticDrops);
  } else {
    status.className='status';
    status.textContent='Drop data unavailable for this enemy.';
  }
}

function parseWikiDrops(wikitext) {
  const drops = [];
  const regex = /\|\s*([^\|]+?)\s*\|\|\s*([\d,\-]+(?:\s*[\-–]\s*[\d,]+)?)\s*\|\|\s*([\d.,]+)/g;
  let m;
  const seen = new Set();
  while ((m=regex.exec(wikitext))!==null && drops.length<12) {
    const name = m[1].replace(/\[\[|\]\]/g,'').split('|')[0].trim();
    const qty = m[2].trim();
    if (name && !seen.has(name) && name.length>1 && name.length<40) {
      seen.add(name);
      drops.push({name, qty, rare: parseFloat(m[3])<1});
    }
  }
  return drops;
}

function renderDrops(drops) {
  document.getElementById('dropsGrid').innerHTML = drops.map(d =>
    `<div class="drop-chip${d.rare?' rare':''}">
      <span class="drop-name">${d.name}</span>
      <span class="drop-qty">×${d.qty}</span>
    </div>`
  ).join('');
}

function getLivePrice(itemId) {
  if (!itemId) return null;
  const d = geprices[itemId];
  if (!d) return null;
  // Use avg of high and low
  const high = d.high || 0;
  const low = d.low || 0;
  return high && low ? Math.round((high + low) / 2) : (high || low);
}

function renderCostBreakdown(method, actionsNeeded) {
  const sec = document.getElementById('costSection');
  if (!method.material) { sec.style.display='none'; return; }

  const mat = method.material;
  const totalQty = Math.ceil(actionsNeeded * mat.qty);
  const livePrice = getLivePrice(mat.itemId);
  const priceEach = livePrice || Math.abs(method.gpPerAction || 0);
  const totalCost = totalQty * priceEach;
  const selling = mat.selling; // selling = gaining GP not spending

  sec.style.display = 'block';
  document.getElementById('costGrid').innerHTML = `
    <div class="result-card">
      <div class="result-label">${mat.name}</div>
      <div class="result-val">${fmtNum(totalQty)}</div>
      <div style="font-size:11px;color:var(--text3);margin-top:3px">needed</div>
    </div>
    <div class="result-card">
      <div class="result-label">Price each</div>
      <div class="result-val ${livePrice ? 'green' : ''}">${fmtNum(priceEach)} gp</div>
      <div style="font-size:11px;color:var(--text3);margin-top:3px">${livePrice ? '🟢 live GE price' : '⚪ estimated'}</div>
    </div>
    <div class="result-card">
      <div class="result-label">Total ${selling ? 'profit' : 'cost'}</div>
      <div class="result-val ${selling ? 'green' : 'red'}">${selling ? '+' : '-'}${fmtNum(totalCost)} gp</div>
      <div style="font-size:11px;color:var(--text3);margin-top:3px">${selling ? 'sell on GE' : 'buy on GE'}</div>
    </div>
    <div class="result-card">
      <div class="result-label">Cost per level</div>
      <div class="result-val" style="font-size:16px">${fmtNum(Math.round(totalCost / Math.max(1, parseInt(document.getElementById('targetLvl').value) - parseInt(document.getElementById('currentLvl').value))))} gp</div>
      <div style="font-size:11px;color:var(--text3);margin-top:3px">avg per level</div>
    </div>
  `;
}

// ─── CALCULATE ───────────────────────────────────────────────
function calculate() {
  const sec = document.getElementById('resultsSection');
  if (!selectedMethod) { sec.style.display='none'; return; }

  const curLvl = Math.min(99, Math.max(1, parseInt(document.getElementById('currentLvl').value) || 1));
  const tgtLvl = Math.min(99, Math.max(curLvl + 1, parseInt(document.getElementById('targetLvl').value) || 99));

  // XP_TABLE is 0-indexed: index = level number
  const curXP = XP_TABLE[curLvl];
  const tgtXP = XP_TABLE[tgtLvl];
  const xpNeeded = tgtXP - curXP;

  const xphr = Math.max(1, estimateXphr(selectedMethod));
  const hours = xpNeeded / xphr;
  const actions = Math.ceil(xpNeeded / selectedMethod.xpEach);
  const gphr = getGphr(selectedMethod, xphr);
  const progress = Math.min(100, (curXP / XP_TABLE[99]) * 100);

  sec.style.display = 'block';

  let gpCard = '';
  if (gphr != null) {
    const cls = gphr >= 0 ? 'green' : 'red';
    const sign = gphr >= 0 ? '+' : '';
    gpCard = `<div class="result-card"><div class="result-label">GP / hr</div><div class="result-val ${cls}">${sign}${fmtNum(gphr)}</div></div>`;
  }

  // Total cost card for buyable skills
  let costCard = '';
  const costData = getTotalCost(selectedMethod, actions);
  if (costData) {
    costCard = `<div class="result-card" style="grid-column:span 2">
      <div class="result-label">Total GP cost</div>
      <div class="result-val red" style="font-size:18px">-${fmtNum(costData.totalCost)}</div>
      <div style="font-size:11px;color:var(--text3);margin-top:4px">${fmtNum(costData.totalItems)} × ${costData.itemName} · ${costData.breakdown}</div>
    </div>`;
  }

  document.getElementById('resultsGrid').innerHTML =
    `<div class="result-card"><div class="result-label">XP needed</div><div class="result-val">${fmtNum(xpNeeded)}</div></div>
     <div class="result-card"><div class="result-label">Time</div><div class="result-val gold">${fmtTime(hours)}</div></div>
     <div class="result-card"><div class="result-label">${selectedMethod.unit}</div><div class="result-val">${fmtNum(actions)}</div></div>
     ${gpCard}
     <div class="result-card"><div class="result-label">Levels</div><div class="result-val" style="font-size:16px">${curLvl} → ${tgtLvl}</div></div>
     ${costCard}`;

  // Cost breakdown
  document.getElementById('costMethodName').textContent = selectedMethod.name;
  renderCostBreakdown(selectedMethod, actions);

  document.getElementById('lvlWarn').innerHTML = curLvl < selectedMethod.lvl
    ? `<div class="warn">⚠ This method requires level ${selectedMethod.lvl}</div>` : '';
  document.getElementById('xpBarFill').style.width = progress + '%';
  document.getElementById('xpBarLeft').textContent = fmtNum(curXP) + ' XP';
  document.getElementById('xpBarRight').textContent = fmtNum(xpNeeded) + ' XP to go';
  renderRoadmap();
}

// ─── UTILS ───────────────────────────────────────────────────
function fmtNum(n) {
  if (isNaN(n) || !isFinite(n)) return '0';
  if (Math.abs(n)>=1e6) return (n/1e6).toFixed(2)+'M';
  if (Math.abs(n)>=1e3) return (n/1e3).toFixed(1)+'K';
  return Math.round(n).toLocaleString();
}
function fmtTime(h) {
  if (isNaN(h) || !isFinite(h) || h<=0) return '0 min';
  if (h<1/60) return Math.round(h*3600)+' sec';
  if (h<1) return Math.round(h*60)+' min';
  const hh=Math.floor(h), mm=Math.round((h-hh)*60);
  return mm===0?hh+'h':hh+'h '+mm+'m';
}

// ─── EVENTS ──────────────────────────────────────────────────
document.getElementById('username').addEventListener('keydown', e=>{ if(e.key==='Enter') fetchHiscores(); });
document.getElementById('methodSearch').addEventListener('input', e=>renderMethods(e.target.value));
['currentLvl','targetLvl'].forEach(id=>document.getElementById(id).addEventListener('input', calculate));

init();
</script>
